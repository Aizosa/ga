name: Build GCC 16.2.0 (x86_64, NLS)

# Manual trigger only: a full GCC bootstrap is long and memory-heavy,
# we do not want it to run on every push.
on:
  workflow_dispatch:

jobs:
  build-gcc:
    name: Bootstrap GCC on macOS 26 Intel
    # x86_64 runner to match the Intel macOS guest in this project.
    # macos-26 is arm64; do not switch to it.
    runs-on: macos-26-intel
    # GitHub job hard cap is 6h; leave headroom for packaging and upload.
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GCC 16.2.0 with NLS
        run: |
          chmod +x scripts/build-gcc.sh
          bash scripts/build-gcc.sh

      - name: Upload GCC bundle
        uses: actions/upload-artifact@v4
        with:
          name: gcc-16.2.0-x86_64-darwin26-nls
          path: ${{ github.workspace }}/gcc-16.2.0-x86_64-darwin26-nls.tar.gz
          retention-days: 14

      - name: Upload build verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-build-reports
          path: |
            ${{ github.workspace }}/gcc-version.txt
            ${{ github.workspace }}/gcc-16.otool.txt
            ${{ github.workspace }}/nls-mo.txt
            ${{ github.workspace }}/frontends.txt
          retention-days: 14
